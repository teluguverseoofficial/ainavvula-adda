name: Auto Upload Single Viral Telugu AI Comedy Short

on:
  schedule:
    # Single daily run at 6:30 PM IST (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg & Lohit Telugu Font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig
          mkdir -p ~/.fonts
          curl -L -o ~/.fonts/Lohit-Telugu.ttf "https://github.com/google/fonts/raw/main/ofl/lohittelugu/Lohit-Telugu.ttf"
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        run: |
          cat << 'EOF' > token.json
          ${{ secrets.YOUTUBE_TOKEN_JSON }}
          EOF

      - name: Generate and Upload Single Viral Telugu Comedy Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Save Used Scenario History to Prevent Repeats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_scenarios.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record used viral comedy scenario [skip ci]"
            git push
          fi
