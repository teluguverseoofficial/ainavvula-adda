name: Daily AI Telugu Comedy Short

on:
  schedule:
    # 6:30 PM IST (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'bot.py'
      - 'requirements.txt'
      - '.github/workflows/daily_upload.yml'

permissions:
  contents: write

concurrency:
  group: daily-telugu-comedy-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Telugu font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fontconfig fonts-lohit-telugu
          mkdir -p ~/.fonts
          curl -fL --retry 3 -o ~/.fonts/Lohit-Telugu.ttf "https://github.com/google/fonts/raw/main/ofl/lohittelugu/Lohit-Telugu.ttf"
          fc-cache -f -v

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore YouTube OAuth token
        env:
          YOUTUBE_TOKEN_JSON: \${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          token = os.environ.get("YOUTUBE_TOKEN_JSON", "")
          if not token.strip():
              raise SystemExit("Missing YOUTUBE_TOKEN_JSON GitHub secret")
          with open("token.json", "w", encoding="utf-8") as f:
              f.write(token)
          PY

      - name: Generate and upload one AI Telugu comedy Short
        env:
          GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: gemini-3.5-flash
          GEMINI_IMAGE_MODEL: gemini-3.1-flash-image
          YOUTUBE_PRIVACY_STATUS: public
        run: python bot.py

      - name: Save scenario history
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add used_scenarios.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record used Telugu comedy scenario [skip ci]"
            git push
          fi

      - name: Keep generated sample video as an artifact
        if: always() && hashFiles('final_short.mp4') != ''
        uses: actions/upload-artifact@v4
        with:
          name: telugu-comedy-sample
          path: final_short.mp4
          retention-days: 7
